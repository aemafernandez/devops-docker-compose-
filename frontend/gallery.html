<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Galería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">Galería</span>
    <button class="btn btn-outline-light btn-sm" onclick="goBack()">Volver al Dashboard</button>
  </div>
</nav>

<div class="container">
  <h3 class="mb-4">Imágenes</h3>
  <div id="gallery" class="row g-3">
    <!-- Las imágenes se cargarán aquí -->
  </div>
  <div id="msg" class="mt-3 text-danger small"></div>
</div>

<script>
function goBack() {
  window.location.href = '/dashboard';
}

async function loadGallery() {
  const msg = document.getElementById('msg');
  msg.textContent = '';

  try {
    console.log('Cargando galería...');
    const res = await fetch('/api/images');
    console.log('Respuesta:', res);
    if (!res.ok) {
      msg.textContent = 'No se pudieron cargar las imágenes';
      console.error('Error en respuesta:', res.status);
      return;
    }
    const data = await res.json();
    console.log('Datos recibidos:', data);
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    data.images.forEach(img => {
      console.log('Procesando imagen:', img);
      const col = document.createElement('div');
      col.className = 'col-md-4';
      col.innerHTML = `
        <div class="card shadow-sm">
          <img src="${img.url}" class="card-img-top" alt="${img.alt}" onerror="console.error('Error cargando imagen:', this.src)">
          <div class="card-body">
            <h5 class="card-title">${img.alt}</h5>
          </div>
        </div>
      `;
      gallery.appendChild(col);
    });
  } catch (e) {
    msg.textContent = 'Error de conexión con la API';
    console.error('Error en loadGallery:', e);
  }
}

loadGallery();
</script>
</body>
</html>
